header{position:sticky;top:0;z-index:5;background:#3a3f45ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}.logo b{text-shadow:0 0 10px var(--accent);color:var(--accent)}
nav{display:flex;gap:6px}
nav button{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
#lang{padding:7px;border-radius:10px;border:1px solid var(--line);background:#555b63;color:var(--text);font-size:14px}
#timer{margin-inline-start:auto;font-size:13px;color:var(--muted)}#timer b{color:var(--text)}
main{padding:14px;max-width:1200px;margin:auto}
h2{text-shadow:0 1px 6px #000a;font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c{background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px #b8f2ff22;border-bottom:5px solid var(--rc,#8f9aa6);transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-3px);box-shadow:0 6px 16px #b8f2ff55}
.im{aspect-ratio:1;background:linear-gradient(160deg,#7b828b,#464b52);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:8px;font-size:14px}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.t{padding:8px 10px 10px}
.n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}.p b{color:var(--accent)}
.rx{display:flex;justify-content:space-around;padding:5px 4px 8px;border-top:1px solid var(--line)}
.rx button{background:none;border:0;font-size:18px;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.5;transition:transform .1s}
.rx button.on{opacity:1;background:#1e90ff22;transform:scale(1.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.chips button{flex:none;border:0;padding:10px 15px;border-radius:999px;background:var(--panel);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #b8f2ff22;white-space:nowrap}
.chips button.on{background:var(--accent);color:#001;box-shadow:0 0 14px var(--accent)}
#tabs button{flex:1;text-align:center;font-size:15px}
#schips{display:none}
#lang{border:1px solid var(--accent);box-shadow:0 0 8px #b8f2ff88}
select:focus,input:focus,button:focus-visible,#lang:focus{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 14px var(--accent)}
select,input,button{-webkit-tap-highlight-color:transparent}
.box{position:relative}
.x{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:50%;width:34px;height:34px;background:#000a;color:#fff;font-size:16px;cursor:pointer}
.vid{aspect-ratio:16/9;background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.yt{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--accent);color:#001;font-weight:800;text-decoration:none}
#inst{display:none;padding:7px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#001;font-weight:800;font-size:13px;cursor:pointer}
.retry{margin-top:10px;padding:8px 18px;border:0;border-radius:999px;background:var(--accent);color:#001;font-weight:800;cursor:pointer}
#own{text-align:center;padding:18px 12px 28px;font-weight:800;color:var(--accent);text-shadow:0 0 10px var(--accent)}
#ownbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:4px 10px;margin-inline-start:8px;cursor:pointer;font-size:15px}
.box label{display:block;margin:10px 0;font-size:13px;color:var(--muted)}
.box label input{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#555b63;color:var(--text);font-size:16px}
.box label input[type=color]{height:44px;padding:2px}
.box .im{perspective:700px;touch-action:none;overflow:hidden}
@keyframes swing{from{transform:rotateY(-35deg) rotateX(4deg)}to{transform:rotateY(35deg) rotateX(-4deg)}}
.box .im img{transition:transform .12s ease-out;will-change:transform;filter:drop-shadow(0 18px 14px #0008)}
.vb{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px}

.vh{display:flex;align-items:center;gap:10px;margin:16px 0 8px;color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase}
.vh::before,.vh::after{content:"";flex:1;height:3px;background:#fff3;border-radius:2px}
.vr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vr img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#0004}
.ds{text-align:center;font-style:italic;margin:16px 0;color:var(--text)!important;font-size:16px!important}
.info{background:#0003;border-radius:14px;padding:8px 14px;margin-top:10px}
.ir{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.ir span{color:var(--muted)}
.sty{cursor:pointer;border:3px solid transparent;box-sizing:border-box}
.sty.on{border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.lv{padding:8px 8px 10px;border-top:1px solid var(--line);font-size:12px;color:#7fd3ff;font-weight:800;text-align:center;line-height:1.4}
.sg{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:170px;grid-auto-flow:dense;gap:10px}

.ti{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--panel);border-bottom:4px solid var(--rc,#b8f2ff);box-shadow:0 2px 10px #b8f2ff22;transition:transform .15s}
.ti:hover{transform:translateY(-3px)}
.tib{position:absolute;inset:0;background:linear-gradient(160deg,#7b828b,#464b52);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:8px}
.tib img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.tt{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;background:linear-gradient(0deg,#000d,#0000);direction:ltr;text-align:left}
.tn{font-weight:900;text-transform:uppercase;font-size:14px;line-height:1.1;text-shadow:0 2px 4px #000;color:#fff}
.tp{display:flex;align-items:center;gap:5px;font-weight:800;margin-top:5px;color:#fff}
.tl{position:absolute;top:8px;left:10px;padding:0;background:none;font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 3px #0009;direction:ltr;z-index:1;letter-spacing:.3px}
.c{position:relative;box-shadow:0 12px 26px #000a,0 2px 6px #0007,inset 0 0 0 1px #ffffff1c,0 0 20px #b8f2ff26}

.c:hover::before,.c:active::before{background-position:0 0,-20% 0}

.box{box-shadow:0 24px 70px #000d,0 0 34px #b8f2ff40,inset 0 0 0 1px #ffffff1f}
.box .im{background:radial-gradient(ellipse at 50% 30%,#8b939c,#3a3f46 70%,#23272c)}
.ti{border-bottom:none;box-shadow:0 4px 14px #0005}
.tt{background:linear-gradient(0deg,#5d636bf5,#5d636bcc 60%,#5d636b00)}
.tn{text-shadow:0 1px 3px #0006}

.box{border-bottom:none;box-shadow:0 20px 50px #0007}

.h2n{color:#b8f2ff;text-shadow:0 0 8px #b8f2ffaa,0 0 18px #8fe6ff77}

const newer=entries.filter(e=>addedOf(e)>0&&now-addedOf(e)<NEWMS).sort((a,b)=>addedOf(b)-addedOf(a)).slice(0,12);
const newSet=new Set(newer);
for(const g in groups)groups[g].list=groups[g].list.filter(e=>!newSet.has(e));
if(newer.length)groups.__new={name:T("new"),rank:1e9,list:newer,isNew:true};
const secs=Object.values(groups).sort((a,b)=>b.rank-a.rank);
let h="";
for(const sec of secs){
if(!sec.list.length)continue;
if(!sec.isNew)sec.list.sort((a,b)=>(b.sortPriority||0)-(a.sortPriority||0));
h+=(sec.isNew?"":`<h2>${esc(sec.name)}</h2>`)+'<div class="sg">';
for(const e of sec.list){
const items=e.brItems||[];if(!items.length&&!e.bundle)continue;
const m=e.newDisplayAsset&&e.newDisplayAsset.materialInstances&&e.newDisplayAsset.materialInstances[0],mi=m&&m.images||{};
const art=mi.Background||mi.OfferImage;
const f=items[0]||{},im=f.images||{};
let o;
if(items.length===1&&!e.bundle){SHOP_PRICE[f.id]=e.finalPrice;o=obj(f,e.finalPrice,false);o.imgs=[art,im.featured,im.icon,im.smallIcon]}
else{o={name:e.bundle?e.bundle.name:(f.name+" +"+(items.length-1)),imgs:[e.bundle&&e.bundle.image,art,im.featured,im.icon],rar:f.rarity&&f.rarity.value,rarName:T("bundle"),type:"bundle",out:e.outDate,price:e.finalPrice,desc:items.map(i=>i.name).join(", ")}}
o.isnew=!!sec.isNew;h+=tile(o,tileSpan(e))}
h+="</div>"}
tries.s=0;$("shopbody").innerHTML=h||'<div class="msg">'+T("empty")+'</div>'}
catch(e){$("shopbody").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small><br>${T("retrying")}<br><button class="retry" onclick="loadShop()">↻</button></div>`;if((tries.s=(tries.s||0)+1)<10)setTimeout(loadShop,8000)}}
async function getList(t){
const key=t||"all";
if(cache[key])return cache[key];
if(t){
try{const r=await fetch(API+"cosmetics/br/search/all?type="+t+"&language="+APIL[lang]);
if(r.ok){const j=await r.json();const d=(j.data||[]).filter(i=>i.type&&i.type.value===t);if(d.length>5){cache[key]=d;return d}}}catch(e){}
}
if(!cache.full){const r=await fetch(API+"cosmetics/br?language="+APIL[lang]);if(!r.ok)throw new Error(r.status);const j=await r.json();cache.full=j.data||[]}
cache[key]=t?cache.full.filter(i=>i.type&&i.type.value===t):cache.full;
return cache[key]}
async function loadType(){
const t=$("type").value;page=1;
$("all").innerHTML='<div class="msg">'+T("loading")+'</div>';
try{list=(await getList(t)).filter(i=>i.images&&(i.images.icon||i.images.smallIcon))}
catch(e){$("all").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small><br>${T("retrying")}<br><button class="retry" onclick="loadType()">↻</button></div>`;if((tries.t=(tries.t||0)+1)<10)setTimeout(()=>{if(!$("s2").hidden)loadType()},8000);return}
tries.t=0;const rs={};list.forEach(i=>{if(i.rarity)rs[i.rarity.value]=i.rarity.displayValue});
$("rar").innerHTML='<option value="">'+T("allr")+'</option>'+Object.keys(rs).map(k=>`<option value="${k}">${rs[k]}</option>`).join("");
draw()}
function draw(){
const q=$("q").value.toLowerCase(),r=$("rar").value,s=$("sort").value;
let f=list.filter(i=>i.name.toLowerCase().includes(q)&&(!r||(i.rarity&&i.rarity.value===r)));
if(s==="new")f=f.slice().sort((a,b)=>new Date(b.added||0)-new Date(a.added||0));
else if(s==="old")f=f.slice().sort((a,b)=>new Date(a.added||0)-new Date(b.added||0));
else f=f.slice().sort((a,b)=>a.name.localeCompare(b.name));
const sh=f.slice(0,page*PER);$("cnt").textContent=($("type").value?T($("type").value):T("allitems"))+": "+f.length+" / "+list.length;
$("all").innerHTML=sh.map(i=>card(obj(i,SHOP_PRICE[i.id],true))).join("");
$("more").hidden=sh.length>=f.length}
window.addEventListener("scroll",()=>{if(!$("s2").hidden&&!$("more").hidden&&innerHeight+scrollY>document.body.offsetHeight-700){page++;draw()}});
let dp=null;let tries={};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").style.display="inline-block"});
async function install(){if(!dp)return;dp.prompt();try{await dp.userChoice}catch(x){}dp=null;$("inst").style.display="none"}
window.addEventListener("appinstalled",()=>{$("inst").style.display="none"});
if(matchMedia("(display-mode: standalone)").matches)$("inst").style.display="none";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let CFG={};try{CFG=JSON.parse(localStorage.getItem("cfg")||"{}")}catch(e){}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function applyCfg(){
if(CFG.a)document.documentElement.style.setProperty("--accent",CFG.a);
if(CFG.n1!=null||CFG.n2!=null){$("logo").innerHTML=esc(CFG.n1||"")+" <b>"+esc(CFG.n2||"")+"</b>";document.title=((CFG.n1||"")+" "+(CFG.n2||"")).trim()||"Fortnite"}
if(CFG.o&&$("ownname"))$("ownname").textContent=CFG.o}
function owner(){
let pin=null;try{pin=localStorage.getItem("pin")}catch(e){}
if(!pin){const p=prompt(T("setpin"));if(!p)return;try{localStorage.setItem("pin",p)}catch(e){}}
else{const p=prompt(T("enterpin"));if(p!==pin)return}
$("box").style.setProperty("--rc","#b8f2ff");
$("box").innerHTML=`<button class="x" onclick="closeM()">✕</button><div class="t"><h3>👑 ${T("panel")}</h3>
<label>${T("n1")}<input id="f1" value="${esc(CFG.n1!=null?CFG.n1:"FORTNITE")}"></label>
<label>${T("n2")}<input id="f2" value="${esc(CFG.n2!=null?CFG.n2:"OPS")}"></label>
<label>${T("ownerlbl")}<input id="f3" value="${esc(CFG.o||"Shmuel")}"></label>
<label>${T("color")}<input id="f4" type="color" value="${CFG.a||"#b8f2ff"}"></label>
<button class="retry" onclick="saveCfg()">${T("save")}</button> <button class="retry" onclick="resetCfg()">${T("reset2")}</button>
<p>${T("localnote")}</p></div>`;
$("modal").classList.add("on")}
function saveCfg(){CFG={n1:$("f1").value,n2:$("f2").value,o:$("f3").value,a:$("f4").value};try{localStorage.setItem("cfg",JSON.stringify(CFG))}catch(e){}applyCfg();closeM()}
function resetCfg(){CFG={};try{localStorage.removeItem("cfg")}catch(e){}location.reload()}
applyLang();
applyCfg();
loadShop();
</script>
</body>
