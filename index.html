<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnite OPS</title>
<style>
:root{--bg1:#dff3ff;--bg2:#b9e3ff;--panel:#fff;--line:#c4e2f7;--text:#12304a;--muted:#5f7f99;--accent:#1e90ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);font-family:system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#ffffffe6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}.logo b{color:var(--accent)}
nav{display:flex;gap:6px}
nav button{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
#lang{padding:7px;border-radius:10px;border:1px solid var(--line);background:#f4fbff;color:var(--text);font-size:14px}
#timer{margin-inline-start:auto;font-size:13px;color:var(--muted)}#timer b{color:var(--text)}
main{padding:14px;max-width:1200px;margin:auto}
h2{font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c{background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px #1e5a8a22;border-bottom:5px solid var(--rc,#8f9aa6);transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-3px);box-shadow:0 6px 16px #1e5a8a33}
.im{aspect-ratio:1;background:linear-gradient(160deg,var(--rc,#8f9aa6),#0003);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:8px;font-size:14px}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.t{padding:8px 10px 10px}
.n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}.p b{color:var(--accent)}
.rx{display:flex;justify-content:space-around;padding:5px 4px 8px;border-top:1px solid var(--line)}
.rx button{background:none;border:0;font-size:18px;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.5;transition:transform .1s}
.rx button.on{opacity:1;background:#1e90ff22;transform:scale(1.2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);padding:10px;border-radius:14px;box-shadow:0 2px 8px #1e5a8a22}
.bar input,.bar select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#f4fbff;color:var(--text);font-size:14px}
.bar input{flex:1;min-width:160px}
#more{display:block;margin:20px auto;padding:11px 30px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.msg{background:var(--panel);border-radius:14px;padding:16px;color:var(--muted);line-height:1.6}
#modal{position:fixed;inset:0;background:#0a2a4acc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.box{background:var(--panel);border-radius:18px;max-width:480px;width:100%;overflow:hidden;border-bottom:6px solid var(--rc,#888)}
.box .im{aspect-ratio:auto;max-height:60vh}
.box .im img{height:auto;max-height:60vh;object-fit:contain}
.box .t{padding:14px}.box h3{margin:0 0 6px}.box p{margin:4px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<div class="logo">FORTNITE <b>OPS</b></div>
<nav><button id="t1" class="on" data-i="shop" onclick="show(1)">Item Shop</button><button id="t2" data-i="skins" onclick="show(2)">Skins</button></nav>
<div id="timer"></div>
<select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="he">עברית</option><option value="zh">中文</option><option value="es">Español</option><option value="fr">Français</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="ja">日本語</option></select>
</header>
<main>
<section id="s1"><div class="msg" data-i="loading">Loading…</div></section>
<section id="s2" hidden>
<div class="bar">
<input id="q" placeholder="Search skins…" oninput="page=1;draw()">
<select id="type" onchange="loadType()">
<option value="outfit" data-i="outfit">Outfits</option><option value="backpack" data-i="backpack">Back Blings</option><option value="pickaxe" data-i="pickaxe">Pickaxes</option><option value="glider" data-i="glider">Gliders</option><option value="emote" data-i="emote">Emotes</option><option value="wrap" data-i="wrap">Wraps</option>
</select>
<select id="rar" onchange="page=1;draw()"><option value="" data-i="allr">All rarities</option></select>
<select id="sort" onchange="page=1;draw()"><option value="new" data-i="newest">Newest</option><option value="old" data-i="oldest">Oldest</option><option value="az" data-i="az">A–Z</option></select>
</div>
<div class="grid" id="all"></div>
<button id="more" onclick="page++;draw()" hidden data-i="more">Load more</button>
</section>
</main>
<div id="modal" onclick="this.classList.remove('on')"><div class="box" id="box"></div></div>
<script>
const API="https://fortnite-api.com/v2/",PER=60;
const RC={common:"#8f9aa6",uncommon:"#5bb23a",rare:"#2fa8ff",epic:"#b05cf0",legendary:"#f08a2a",mythic:"#e6b800",icon:"#1fc4b3",marvel:"#e23636",dc:"#3b6bd6",dark:"#d1307a",frozen:"#6cc3ee",lava:"#f0572a",gaminglegends:"#7a52e0",shadow:"#666",slurp:"#2ad4d8",starwars:"#d9b52a"};
const col=r=>RC[(r||"").toLowerCase()]||"#8f9aa6";
const $=id=>document.getElementById(id);
let cache={},list=[],page=1,reg=[];
const L={
en:{shop:"Item Shop",skins:"Skins",reset:"Shop resets in",search:"Search skins…",outfit:"Outfits",backpack:"Back Blings",pickaxe:"Pickaxes",glider:"Gliders",emote:"Emotes",wrap:"Wraps",allr:"All rarities",newest:"Newest",oldest:"Oldest",az:"A–Z",more:"Load more",loading:"Loading…",empty:"The shop is empty right now.",bundle:"Bundle",added:"Added",err:"Couldn't load data. Open this file in a regular browser and make sure you're online."},
he:{shop:"חנות",skins:"סקינים",reset:"החנות מתאפסת בעוד",search:"חפש סקין…",outfit:"סקינים",backpack:"תיקי גב",pickaxe:"מכושים",glider:"רחפנים",emote:"ריקודים",wrap:"עטיפות",allr:"כל הנדירויות",newest:"הכי חדשים",oldest:"הכי ישנים",az:"א–ת",more:"עוד",loading:"טוען…",empty:"החנות ריקה כרגע.",bundle:"חבילה",added:"נוסף",err:"לא הצלחתי לטעון. פתח את הקובץ בדפדפן רגיל וודא שיש אינטרנט."},
zh:{shop:"商店",skins:"皮肤",reset:"商店重置倒计时",search:"搜索皮肤…",outfit:"角色",backpack:"背包",pickaxe:"镐",glider:"滑翔伞",emote:"表情",wrap:"包装",allr:"全部稀有度",newest:"最新",oldest:"最早",az:"A–Z",more:"加载更多",loading:"加载中…",empty:"商店目前为空。",bundle:"套装",added:"上架日期",err:"加载失败。请在普通浏览器中打开并确保已联网。"},
es:{shop:"Tienda",skins:"Skins",reset:"La tienda se reinicia en",search:"Buscar skins…",outfit:"Trajes",backpack:"Mochilas",pickaxe:"Picos",glider:"Planeadores",emote:"Gestos",wrap:"Envolturas",allr:"Todas las rarezas",newest:"Más nuevos",oldest:"Más antiguos",az:"A–Z",more:"Cargar más",loading:"Cargando…",empty:"La tienda está vacía ahora.",bundle:"Pack",added:"Añadido",err:"No se pudo cargar. Abre el archivo en un navegador normal y comprueba tu conexión."},
fr:{shop:"Boutique",skins:"Skins",reset:"La boutique se réinitialise dans",search:"Rechercher un skin…",outfit:"Tenues",backpack:"Accessoires de dos",pickaxe:"Pioches",glider:"Planeurs",emote:"Emotes",wrap:"Revêtements",allr:"Toutes raretés",newest:"Plus récents",oldest:"Plus anciens",az:"A–Z",more:"Charger plus",loading:"Chargement…",empty:"La boutique est vide.",bundle:"Pack",added:"Ajouté",err:"Échec du chargement. Ouvre le fichier dans un navigateur normal et vérifie ta connexion."},
ru:{shop:"Магазин",skins:"Скины",reset:"До обновления магазина",search:"Поиск скинов…",outfit:"Наряды",backpack:"Рюкзаки",pickaxe:"Кирки",glider:"Дельтапланы",emote:"Эмоции",wrap:"Обёртки",allr:"Все редкости",newest:"Новые",oldest:"Старые",az:"А–Я",more:"Загрузить ещё",loading:"Загрузка…",empty:"Магазин сейчас пуст.",bundle:"Набор",added:"Добавлено",err:"Не удалось загрузить. Откройте файл в обычном браузере и проверьте интернет."},
de:{shop:"Shop",skins:"Skins",reset:"Shop wird zurückgesetzt in",search:"Skins suchen…",outfit:"Outfits",backpack:"Rücken-Accessoires",pickaxe:"Spitzhacken",glider:"Gleiter",emote:"Emotes",wrap:"Folien",allr:"Alle Seltenheiten",newest:"Neueste",oldest:"Älteste",az:"A–Z",more:"Mehr laden",loading:"Lädt…",empty:"Der Shop ist gerade leer.",bundle:"Paket",added:"Hinzugefügt",err:"Laden fehlgeschlagen. Öffne die Datei in einem normalen Browser und prüfe deine Verbindung."},
ja:{shop:"ショップ",skins:"スキン",reset:"ショップ更新まで",search:"スキンを検索…",outfit:"アウトフィット",backpack:"バックアクセサリー",pickaxe:"ツルハシ",glider:"グライダー",emote:"エモート",wrap:"ラップ",allr:"すべてのレア度",newest:"新しい順",oldest:"古い順",az:"A–Z",more:"もっと見る",loading:"読み込み中…",empty:"現在ショップは空です。",bundle:"バンドル",added:"追加日",err:"読み込めませんでした。通常のブラウザで開き、接続を確認してください。"}
};
const APIL={en:"en",he:"en",zh:"zh-CN",es:"es",fr:"fr",ru:"ru",de:"de",ja:"ja"};
let lang="en";
try{lang=localStorage.getItem("lang")||(navigator.language||"en").slice(0,2)}catch(e){lang=(navigator.language||"en").slice(0,2)}
if(!L[lang])lang="en";
const T=k=>(L[lang]&&L[lang][k])||L.en[k];
const ERR=()=>T("err");
function applyLang(){const d=document.documentElement;d.lang=lang;d.dir=lang==="he"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
$("q").placeholder=T("search");$("lang").value=lang;tick()}
function setLang(v){lang=v;try{localStorage.setItem("lang",v)}catch(e){}
cache={};list=[];page=1;applyLang();loadShop();if(!$("s2").hidden)loadType()}
function show(i){$("s1").hidden=i!==1;$("s2").hidden=i!==2;$("t1").className=i===1?"on":"";$("t2").className=i===2?"on":"";if(i===2&&!list.length)loadType()}
function tick(){const n=new Date(),r=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1));const s=Math.max(0,(r-n)/1000|0),p=x=>String(x).padStart(2,"0");$("timer").innerHTML=`${T("reset")} <b>${p(s/3600|0)}:${p(s%3600/60|0)}:${p(s%60)}</b>`}
setInterval(tick,1000);tick();
function imgTag(o){const a=(o.imgs||[]).filter(Boolean);if(!a.length)return o.name;
return `<img loading="lazy" src="${a[0]}" data-alt="${a.slice(1).join("|")}" data-name="${o.name.replace(/"/g,"")}" onerror="imgFail(this)" alt="">`}
function imgFail(el){const alt=(el.dataset.alt||"").split("|").filter(Boolean);
if(alt.length){el.dataset.alt=alt.slice(1).join("|");el.src=alt[0]}else el.replaceWith(document.createTextNode(el.dataset.name))}
function modal(o){$("box").style.setProperty("--rc",col(o.rar));
const d=o.date?new Date(o.date).toLocaleDateString():"";
$("box").innerHTML=`<div class="im" style="--rc:${col(o.rar)}">${imgTag(o)}</div><div class="t"><h3>${o.name}</h3><p>${o.desc||""}</p><p>${[o.rarName,o.set,o.price?o.price+" V-Bucks":"",d&&T("added")+": "+d].filter(Boolean).join(" · ")}</p></div>`;
$("modal").classList.add("on")}
let RX={};try{RX=JSON.parse(localStorage.getItem("rx")||"{}")}catch(e){}
const EM=["🔥","😍","😎","😂","👎"];
function rxHTML(n){const k=reg[n].id||reg[n].name;return `<div class="rx">${EM.map(e=>`<button class="${RX[k]===e?"on":""}" onclick="react(event,${n},'${e}')">${e}</button>`).join("")}</div>`}
function react(ev,n,e){ev.stopPropagation();const k=reg[n].id||reg[n].name;if(RX[k]===e)delete RX[k];else RX[k]=e;try{localStorage.setItem("rx",JSON.stringify(RX))}catch(x){}
ev.currentTarget.parentNode.querySelectorAll("button").forEach(b=>b.className=b.textContent===RX[k]?"on":"")}
function card(o){const n=reg.push(o)-1;return `<div class="c" style="--rc:${col(o.rar)}" onclick="modal(reg[${n}])"><div class="im">${imgTag(o)}</div><div class="t"><div class="n">${o.name}</div><div class="p"><span>${o.rarName||""}</span>${o.price?`<b>${o.price} V</b>`:""}</div></div>${rxHTML(n)}</div>`}
function obj(it,price){const im=it.images||{};return{id:it.id,name:it.name,imgs:[im.icon,im.smallIcon,im.featured],rar:it.rarity&&it.rarity.value,rarName:it.rarity&&it.rarity.displayValue,desc:it.description,set:it.set&&it.set.value,date:it.added,price}}
async function loadShop(){
try{
const r=await fetch(API+"shop?language="+APIL[lang]);if(!r.ok)throw new Error(r.status);
const j=await r.json(),groups={};
for(const e of (j.data.entries||[])){const g=(e.layout&&e.layout.name)||"Featured";(groups[g]=groups[g]||[]).push(e)}
let h="";
for(const g in groups){h+=`<h2>${g}</h2><div class="grid">`;
for(const e of groups[g]){const items=e.brItems||[];
if(e.bundle){const m=e.newDisplayAsset&&e.newDisplayAsset.materialInstances&&e.newDisplayAsset.materialInstances[0],mi=m&&m.images||{};
h+=card({name:e.bundle.name,imgs:[e.bundle.image,mi.Background,mi.OfferImage,items[0]&&items[0].images&&items[0].images.icon],rar:items[0]&&items[0].rarity&&items[0].rarity.value,rarName:T("bundle"),price:e.finalPrice,desc:items.map(i=>i.name).join(", ")})}
else for(const it of items)h+=card(obj(it,items.length===1?e.finalPrice:null))}
h+="</div>"}
$("s1").innerHTML=h||'<div class="msg">'+T("empty")+'</div>'}
catch(e){$("s1").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small></div>`}}
async function loadType(){
const t=$("type").value;page=1;
if(!cache[t]){$("all").innerHTML='<div class="msg">'+T("loading")+'</div>';
try{const r=await fetch(API+"cosmetics/br?type="+t+"&language="+APIL[lang]);if(!r.ok)throw new Error(r.status);const j=await r.json();cache[t]=(j.data||[]).filter(i=>i.images&&(i.images.icon||i.images.smallIcon))}
catch(e){$("all").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small></div>`;return}}
list=cache[t];
const rs={};list.forEach(i=>{if(i.rarity)rs[i.rarity.value]=i.rarity.displayValue});
$("rar").innerHTML='<option value="">'+T("allr")+'</option>'+Object.keys(rs).map(k=>`<option value="${k}">${rs[k]}</option>`).join("");
draw()}
function draw(){
const q=$("q").value.toLowerCase(),r=$("rar").value,s=$("sort").value;
let f=list.filter(i=>i.name.toLowerCase().includes(q)&&(!r||(i.rarity&&i.rarity.value===r)));
if(s==="new")f=f.slice().sort((a,b)=>new Date(b.added||0)-new Date(a.added||0));
else if(s==="old")f=f.slice().sort((a,b)=>new Date(a.added||0)-new Date(b.added||0));
else f=f.slice().sort((a,b)=>a.name.localeCompare(b.name));
const sh=f.slice(0,page*PER);
$("all").innerHTML=sh.map(i=>card(obj(i))).join("");
$("more").hidden=sh.length>=f.length}
applyLang();
loadShop();
</script>
</body>
</html>
