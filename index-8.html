main{padding:14px;max-width:1200px;margin:auto}
h2{text-shadow:0 1px 6px #000a;font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c{background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px #00e5ff22;border-bottom:5px solid var(--rc,#8f9aa6);transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-3px);box-shadow:0 6px 16px #00e5ff55}
.im{aspect-ratio:1;background:linear-gradient(160deg,#7b828b,#464b52);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:8px;font-size:14px}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.t{padding:8px 10px 10px}
.n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}.p b{color:var(--accent)}
.rx{display:flex;justify-content:space-around;padding:5px 4px 8px;border-top:1px solid var(--line)}
.rx button{background:none;border:0;font-size:18px;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.5;transition:transform .1s}
.rx button.on{opacity:1;background:#1e90ff22;transform:scale(1.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.chips button{flex:none;border:0;padding:10px 15px;border-radius:999px;background:var(--panel);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #00e5ff22;white-space:nowrap}
.chips button.on{background:var(--accent);color:#001;box-shadow:0 0 14px var(--accent)}
#tabs button{flex:1;text-align:center;font-size:15px}
#schips{display:none}
#lang{border:1px solid var(--accent);box-shadow:0 0 8px #00e5ff88}
select:focus,input:focus,button:focus-visible,#lang:focus{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 14px var(--accent)}
select,input,button{-webkit-tap-highlight-color:transparent}
.box{position:relative}
.x{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:50%;width:34px;height:34px;background:#000a;color:#fff;font-size:16px;cursor:pointer}
.vid{aspect-ratio:16/9;background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.yt{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--accent);color:#001;font-weight:800;text-decoration:none}
#inst{display:none;padding:7px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#001;font-weight:800;font-size:13px;cursor:pointer}
.retry{margin-top:10px;padding:8px 18px;border:0;border-radius:999px;background:var(--accent);color:#001;font-weight:800;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);padding:10px;border-radius:14px;box-shadow:0 2px 8px #00e5ff22}
.bar input,.bar select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#555b63;color:var(--text);font-size:14px}
.bar input{flex:1;min-width:160px}
#more{display:block;margin:20px auto;padding:11px 30px;border:0;border-radius:999px;background:var(--accent);color:#001;font-size:15px;font-weight:700;cursor:pointer}
.msg{background:var(--panel);border-radius:14px;padding:16px;color:var(--muted);line-height:1.6}
#modal{position:fixed;inset:0;background:#000000cc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.box{background:var(--panel);border-radius:18px;max-width:480px;width:100%;overflow:hidden;border-bottom:6px solid var(--rc,#888)}
.box .im{aspect-ratio:auto;max-height:60vh}
.box .im img{height:auto;max-height:60vh;object-fit:contain}
.box .t{padding:14px}.box h3{margin:0 0 6px}.box p{margin:4px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<div class="logo">FORTNITE <b>OPS</b></div>
<div id="timer"></div>
<select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="he">עברית</option><option value="zh">中文</option><option value="es">Español</option><option value="fr">Français</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="ja">日本語</option></select>
<button id="inst" onclick="install()">📲 <span data-i="install">Install app</span></button>
</header>
<main>
<div class="chips" id="tabs"></div>
<section id="s1"><div class="chips" id="schips"></div><div id="shopbody"><div class="msg" data-i="loading">Loading…</div></div></section>
<section id="s2" hidden>
<h2 id="ptitle"></h2>
<div class="bar">
<input id="q" placeholder="Search skins…" oninput="page=1;draw()">
<select id="type" onchange="loadType()"><option value="" data-i="allt">All types</option>
<option value="outfit" data-i="outfit">Outfits</option><option value="backpack" data-i="backpack">Back Blings</option><option value="pickaxe" data-i="pickaxe">Pickaxes</option><option value="glider" data-i="glider">Gliders</option><option value="emote" data-i="emote">Emotes</option><option value="wrap" data-i="wrap">Wraps</option><option value="contrail" data-i="contrail">Contrails</option><option value="spray" data-i="spray">Sprays</option><option value="loadingscreen" data-i="loadingscreen">Loading Screens</option>
</select>
<select id="rar" onchange="page=1;draw()"><option value="" data-i="allr">All rarities</option></select>
<select id="sort" onchange="page=1;draw()"><option value="new" data-i="newest">Newest</option><option value="old" data-i="oldest">Oldest</option><option value="az" data-i="az">A–Z</option></select>
</div>
<div id="cnt" style="margin:0 0 10px;font-weight:700;text-shadow:0 1px 6px #000a"></div>
<div class="grid" id="all"></div>
<button id="more" onclick="page++;draw()" hidden data-i="more">Load more</button>
</section>
</main>
<div id="modal" onclick="closeM()"><div class="box" id="box" onclick="event.stopPropagation()"></div></div>
<script>
const API="https://fortnite-api.com/v2/",PER=100;
const RC={common:"#8f9aa6",uncommon:"#5bb23a",rare:"#2fa8ff",epic:"#b05cf0",legendary:"#f08a2a",mythic:"#e6b800",icon:"#1fc4b3",marvel:"#e23636",dc:"#3b6bd6",dark:"#d1307a",frozen:"#6cc3ee",lava:"#f0572a",gaminglegends:"#7a52e0",shadow:"#666",slurp:"#2ad4d8",starwars:"#d9b52a"};
const col=r=>"#00e5ff";const colOld=r=>RC[(r||"").toLowerCase()]||"#8f9aa6";
const $=id=>document.getElementById(id);
let cache={},list=[],page=1,reg=[];
const L={
en:{shop:"Item Shop",retrying:"Server is busy, retrying automatically…",install:"Install app",instsel:"Tap the ⋮ menu at the top of Chrome, then choose Add to Home screen.",watch:"Watch video",allitems:"All Items",allt:"All types",all:"All",skins:"Skins",reset:"Shop resets in",search:"Search skins…",outfit:"Outfits",backpack:"Back Blings",pickaxe:"Pickaxes",glider:"Gliders",emote:"Emotes",wrap:"Weapon Wraps",contrail:"Contrails",spray:"Sprays",loadingscreen:"Loading Screens",allr:"All rarities",newest:"Newest",oldest:"Oldest",az:"A–Z",more:"Load more",loading:"Loading…",empty:"The shop is empty right now.",bundle:"Bundle",added:"Added",err:"Couldn't load data. Open this file in a regular browser and make sure you're online."},
he:{shop:"חנות",retrying:"השרת עמוס, מנסה שוב אוטומטית…",install:"התקן אפליקציה",instsel:"לחץ על שלוש הנקודות ⋮ בראש Chrome, ואז בחר הוסף למסך הבית.",watch:"צפה בסרטון",allitems:"כל הפריטים",allt:"כל הסוגים",all:"הכל",skins:"סקינים",reset:"החנות מתאפסת בעוד",search:"חפש סקין…",outfit:"סקינים",backpack:"תיקי גב",pickaxe:"מכוש (פיקאקס)",glider:"רחפנים",emote:"ריקודים",wrap:"צבעי נשק",contrail:"שובלים",spray:"גרפיטי",loadingscreen:"מסכי טעינה",allr:"כל הנדירויות",newest:"הכי חדשים",oldest:"הכי ישנים",az:"א–ת",more:"עוד",loading:"טוען…",empty:"החנות ריקה כרגע.",bundle:"חבילה",added:"נוסף",err:"לא הצלחתי לטעון. פתח את הקובץ בדפדפן רגיל וודא שיש אינטרנט."},
zh:{shop:"商店",retrying:"服务器繁忙，正在自动重试…",install:"安装应用",instsel:"点击 Chrome 顶部的 ⋮ 菜单，然后选择“添加到主屏幕”。",watch:"观看视频",allitems:"全部物品",allt:"所有类型",all:"全部",skins:"皮肤",reset:"商店重置倒计时",search:"搜索皮肤…",outfit:"角色",backpack:"背包",pickaxe:"镐",glider:"滑翔伞",emote:"表情",wrap:"包装",contrail:"轨迹",spray:"喷漆",loadingscreen:"加载界面",allr:"全部稀有度",newest:"最新",oldest:"最早",az:"A–Z",more:"加载更多",loading:"加载中…",empty:"商店目前为空。",bundle:"套装",added:"上架日期",err:"加载失败。请在普通浏览器中打开并确保已联网。"},
es:{shop:"Tienda",skins:"Skins",reset:"La tienda se reinicia en",search:"Buscar skins…",outfit:"Trajes",backpack:"Mochilas",pickaxe:"Picos",glider:"Planeadores",emote:"Gestos",wrap:"Envolturas",allr:"Todas las rarezas",newest:"Más nuevos",oldest:"Más antiguos",az:"A–Z",more:"Cargar más",loading:"Cargando…",empty:"La tienda está vacía ahora.",bundle:"Pack",added:"Añadido",err:"No se pudo cargar. Abre el archivo en un navegador normal y comprueba tu conexión."},
fr:{shop:"Boutique",skins:"Skins",reset:"La boutique se réinitialise dans",search:"Rechercher un skin…",outfit:"Tenues",backpack:"Accessoires de dos",pickaxe:"Pioches",glider:"Planeurs",emote:"Emotes",wrap:"Revêtements",allr:"Toutes raretés",newest:"Plus récents",oldest:"Plus anciens",az:"A–Z",more:"Charger plus",loading:"Chargement…",empty:"La boutique est vide.",bundle:"Pack",added:"Ajouté",err:"Échec du chargement. Ouvre le fichier dans un navigateur normal et vérifie ta connexion."},
ru:{shop:"Магазин",skins:"Скины",reset:"До обновления магазина",search:"Поиск скинов…",outfit:"Наряды",backpack:"Рюкзаки",pickaxe:"Кирки",glider:"Дельтапланы",emote:"Эмоции",wrap:"Обёртки",allr:"Все редкости",newest:"Новые",oldest:"Старые",az:"А–Я",more:"Загрузить ещё",loading:"Загрузка…",empty:"Магазин сейчас пуст.",bundle:"Набор",added:"Добавлено",err:"Не удалось загрузить. Откройте файл в обычном браузере и проверьте интернет."},
de:{shop:"Shop",skins:"Skins",reset:"Shop wird zurückgesetzt in",search:"Skins suchen…",outfit:"Outfits",backpack:"Rücken-Accessoires",pickaxe:"Spitzhacken",glider:"Gleiter",emote:"Emotes",wrap:"Folien",allr:"Alle Seltenheiten",newest:"Neueste",oldest:"Älteste",az:"A–Z",more:"Mehr laden",loading:"Lädt…",empty:"Der Shop ist gerade leer.",bundle:"Paket",added:"Hinzugefügt",err:"Laden fehlgeschlagen. Öffne die Datei in einem normalen Browser und prüfe deine Verbindung."},
ja:{shop:"ショップ",skins:"スキン",reset:"ショップ更新まで",search:"スキンを検索…",outfit:"アウトフィット",backpack:"バックアクセサリー",pickaxe:"ツルハシ",glider:"グライダー",emote:"エモート",wrap:"ラップ",allr:"すべてのレア度",newest:"新しい順",oldest:"古い順",az:"A–Z",more:"もっと見る",loading:"読み込み中…",empty:"現在ショップは空です。",bundle:"バンドル",added:"追加日",err:"読み込めませんでした。通常のブラウザで開き、接続を確認してください。"}
};
const APIL={en:"en",he:"en",zh:"zh-CN",es:"es",fr:"fr",ru:"ru",de:"de",ja:"ja"};
let lang="en";
try{lang=localStorage.getItem("lang")||(navigator.language||"en").slice(0,2)}catch(e){lang=(navigator.language||"en").slice(0,2)}
if(!L[lang])lang="en";
const T=k=>(L[lang]&&L[lang][k])||L.en[k];
const ERR=()=>T("err");
const CATS=[["outfit","🧍"],["pickaxe","⛏️"],["emote","💃"],["wrap","🔫"],["backpack","🎒"],["glider","🪂"],["contrail","✨"],["spray","🎨"],["loadingscreen","🖼️"]];
const SF=[["","★"],["outfit","🧍"],["pickaxe","⛏️"],["emote","💃"],["wrap","🔫"],["backpack","🎒"],["glider","🪂"]];
let cur="shop",sf="";
function tabs(){$("tabs").innerHTML=[["shop","🛒"],["allitems","🎒"]].map(c=>`<button class="${cur===c[0]?"on":""}" onclick="go('${c[0]}')">${c[1]} ${T(c[0])}</button>`).join("")}
function schips(){$("schips").innerHTML=SF.map(c=>`<button class="${sf===c[0]?"on":""}" onclick="shopFilter('${c[0]}')">${c[1]} ${c[0]?T(c[0]):T("all")}</button>`).join("")}
function shopFilter(t){sf=t;schips();
document.querySelectorAll("#shopbody .c").forEach(c=>c.style.display=(!t||c.dataset.t===t)?"":"none");
document.querySelectorAll("#shopbody .grid").forEach(g=>{const any=[...g.children].some(c=>c.style.display!=="none");g.style.display=any?"":"none";if(g.previousElementSibling)g.previousElementSibling.style.display=any?"":"none"})}
function title(){if(cur!=="shop")$("ptitle").textContent="🎒 "+T("allitems")}
function go(k){cur=k;tabs();
if(k==="shop"){$("s1").hidden=false;$("s2").hidden=true}
else{$("s1").hidden=true;$("s2").hidden=false;$("type").value="outfit";$("q").value="";title();loadType()}
window.scrollTo(0,0)}
function applyLang(){const d=document.documentElement;d.lang=lang;d.dir=lang==="he"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
$("q").placeholder=T("search");$("lang").value=lang;tick();tabs();schips();title()}
function setLang(v){lang=v;try{localStorage.setItem("lang",v)}catch(e){}
cache={};list=[];page=1;sf="";applyLang();loadShop();if(!$("s2").hidden)loadType()}
function show(i){go(i===1?"shop":"outfit")}
function tick(){const n=new Date(),r=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1));const s=Math.max(0,(r-n)/1000|0),p=x=>String(x).padStart(2,"0");$("timer").innerHTML=`${T("reset")} <b>${p(s/3600|0)}:${p(s%3600/60|0)}:${p(s%60)}</b>`}
setInterval(tick,1000);tick();
function imgTag(o){const a=(o.imgs||[]).filter(Boolean);if(!a.length)return o.name;
return `<img loading="lazy" src="${a[0]}" data-alt="${a.slice(1).join("|")}" data-name="${o.name.replace(/"/g,"")}" onerror="imgFail(this)" alt="">`}
function imgFail(el){const alt=(el.dataset.alt||"").split("|").filter(Boolean);
if(alt.length){el.dataset.alt=alt.slice(1).join("|");el.src=alt[0]}else el.replaceWith(document.createTextNode(el.dataset.name))}
function vid(o){
if(o.video)return `<div class="vid"><iframe src="https://www.youtube.com/embed/${o.video}?rel=0" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
if(o.type==="emote")return `<div class="t"><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent("Fortnite "+o.name+" emote")}">▶ ${T("watch")}</a></div>`;
return ""}
function closeM(){$("modal").classList.remove("on");$("box").innerHTML=""}
function modal(o){$("box").style.setProperty("--rc",col(o.rar));
const d=o.date?new Date(o.date).toLocaleDateString():"";
$("box").innerHTML=`<button class="x" onclick="closeM()">✕</button><div class="im" style="--rc:${col(o.rar)}">${imgTag(o)}</div>${vid(o)}<div class="t"><h3>${o.name}</h3><p>${o.desc||""}</p><p>${[o.rarName,o.set,o.price?o.price+" V-Bucks":"",d&&T("added")+": "+d].filter(Boolean).join(" · ")}</p></div>`;
$("modal").classList.add("on")}
let RX={};try{RX=JSON.parse(localStorage.getItem("rx")||"{}")}catch(e){}
const EM=["🔥","😍","😎","😂","👎"];
function rxHTML(n){const k=reg[n].id||reg[n].name;return `<div class="rx">${EM.map(e=>`<button class="${RX[k]===e?"on":""}" onclick="react(event,${n},'${e}')">${e}</button>`).join("")}</div>`}
function react(ev,n,e){ev.stopPropagation();const k=reg[n].id||reg[n].name;if(RX[k]===e)delete RX[k];else RX[k]=e;try{localStorage.setItem("rx",JSON.stringify(RX))}catch(x){}
ev.currentTarget.parentNode.querySelectorAll("button").forEach(b=>b.className=b.textContent===RX[k]?"on":"")}
function card(o){const n=reg.push(o)-1;return `<div class="c" data-t="${o.type||""}" style="--rc:${col(o.rar)}" onclick="modal(reg[${n}])"><div class="im">${imgTag(o)}</div><div class="t"><div class="n">${o.name}</div><div class="p"><span>${o.rarName||""}</span>${o.price?`<b>${o.price} V</b>`:""}</div></div>${rxHTML(n)}</div>`}
function obj(it,price){const im=it.images||{};return{id:it.id,video:it.showcaseVideo,type:it.type&&it.type.value,name:it.name,imgs:[im.icon,im.smallIcon,im.featured],rar:it.rarity&&it.rarity.value,rarName:it.rarity&&it.rarity.displayValue,desc:it.description,set:it.set&&it.set.value,date:it.added,price}}
async function loadShop(){
try{
const r=await fetch(API+"shop?language="+APIL[lang]);if(!r.ok)throw new Error(r.status);
const j=await r.json(),groups={};
for(const e of (j.data.entries||[])){const g=(e.layout&&e.layout.name)||"Featured";(groups[g]=groups[g]||[]).push(e)}
let h="";
for(const g in groups){h+=`<h2>${g}</h2><div class="grid">`;
for(const e of groups[g]){const items=e.brItems||[];
if(e.bundle){const m=e.newDisplayAsset&&e.newDisplayAsset.materialInstances&&e.newDisplayAsset.materialInstances[0],mi=m&&m.images||{};
h+=card({name:e.bundle.name,imgs:[e.bundle.image,mi.Background,mi.OfferImage,items[0]&&items[0].images&&items[0].images.icon],rar:items[0]&&items[0].rarity&&items[0].rarity.value,rarName:T("bundle"),type:"bundle",price:e.finalPrice,desc:items.map(i=>i.name).join(", ")})}
else for(const it of items)h+=card(obj(it,items.length===1?e.finalPrice:null))}
h+="</div>"}
tries.s=0;$("shopbody").innerHTML=h||'<div class="msg">'+T("empty")+'</div>'}
catch(e){$("shopbody").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small><br>${T("retrying")}<br><button class="retry" onclick="loadShop()">↻</button></div>`;if((tries.s=(tries.s||0)+1)<10)setTimeout(loadShop,8000)}}
async function getList(t){
const key=t||"all";
if(cache[key])return cache[key];
if(t){
try{const r=await fetch(API+"cosmetics/br/search/all?type="+t+"&language="+APIL[lang]);
if(r.ok){const j=await r.json();const d=(j.data||[]).filter(i=>i.type&&i.type.value===t);if(d.length>5){cache[key]=d;return d}}}catch(e){}
}
if(!cache.full){const r=await fetch(API+"cosmetics/br?language="+APIL[lang]);if(!r.ok)throw new Error(r.status);const j=await r.json();cache.full=j.data||[]}
cache[key]=t?cache.full.filter(i=>i.type&&i.type.value===t):cache.full;
return cache[key]}
async function loadType(){
const t=$("type").value;page=1;
$("all").innerHTML='<div class="msg">'+T("loading")+'</div>';
try{list=(await getList(t)).filter(i=>i.images&&(i.images.icon||i.images.smallIcon))}
catch(e){$("all").innerHTML=`<div class="msg">${ERR()}<br><small>${e}</small><br>${T("retrying")}<br><button class="retry" onclick="loadType()">↻</button></div>`;if((tries.t=(tries.t||0)+1)<10)setTimeout(()=>{if(!$("s2").hidden)loadType()},8000);return}
tries.t=0;const rs={};list.forEach(i=>{if(i.rarity)rs[i.rarity.value]=i.rarity.displayValue});
$("rar").innerHTML='<option value="">'+T("allr")+'</option>'+Object.keys(rs).map(k=>`<option value="${k}">${rs[k]}</option>`).join("");
draw()}
function draw(){
const q=$("q").value.toLowerCase(),r=$("rar").value,s=$("sort").value;
let f=list.filter(i=>i.name.toLowerCase().includes(q)&&(!r||(i.rarity&&i.rarity.value===r)));
if(s==="new")f=f.slice().sort((a,b)=>new Date(b.added||0)-new Date(a.added||0));
else if(s==="old")f=f.slice().sort((a,b)=>new Date(a.added||0)-new Date(b.added||0));
else f=f.slice().sort((a,b)=>a.name.localeCompare(b.name));
const sh=f.slice(0,page*PER);$("cnt").textContent=($("type").value?T($("type").value):T("allitems"))+": "+f.length+" / "+list.length;
$("all").innerHTML=sh.map(i=>card(obj(i))).join("");
$("more").hidden=sh.length>=f.length}
window.addEventListener("scroll",()=>{if(!$("s2").hidden&&!$("more").hidden&&innerHeight+scrollY>document.body.offsetHeight-700){page++;draw()}});
let dp=null;let tries={};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").style.display="inline-block"});
async function install(){if(!dp)return;dp.prompt();try{await dp.userChoice}catch(x){}dp=null;$("inst").style.display="none"}
window.addEventListener("appinstalled",()=>{$("inst").style.display="none"});
if(matchMedia("(display-mode: standalone)").matches)$("inst").style.display="none";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyLang();
loadShop();
</script>
</body>
</html>
